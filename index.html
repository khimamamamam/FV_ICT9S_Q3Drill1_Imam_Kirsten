<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q3 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body{
            background-image: url('https://i.pinimg.com/736x/41/df/2b/41df2bc6c6517aa7b7f7153df04bdc50.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .box {
        background-color: rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 8px 32px rgba(99, 10, 10, 0.433);
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.3);
        }


        btn {
            color: rgb(255, 193, 189);
        }

        .btn-neutral {
        background-color: #ffcccc;
        color: rgb(114, 79, 79);
        transition: all 0.3s ease;
        }

        .btn-neutral:hover {
        background-color: #7a5555;
        color: rgb(255, 216, 216);
        box-shadow: 0 0 15px #846464;
        transform: scale(1.1);
        }

        #result {
        font-size: 24px;
        color: rgb(120, 73, 73);
        background-color: #ffc1c1;
        padding: 10px 20px;
        border-radius: 8px;
        text-align: center;
        display: inline-block;
        margin-top: 10px;
        font-weight: bold;
        min-width: 60px;
        min-height: 40px;
    }

    .equation {
    color: #8e5151;
    font-weight: bold;
    }

    </style>
    
</head>
<body>
   <div class="container bg-dark">
        <h1 class="text-center text-light fst-italic" id="head1"></h1>
   </div>
<br>

<!--

<br><br>
<button type="button" class="btn btn-info" onclick="document.write(num1);">Calculate</button>
<br><br>
-->

<div class="container mt-4">
    <div class="box">
        <h1 class="equation text-center">If x = 4, what is 2x+x=?</h1>
        <button type="button" class="btn btn-neutral mt-3" onclick="document.getElementById('result').innerHTML = num1;">Calculate</button>
        <br><br>
        <p id="result" class="mt-3">the answer is..</p>
    </div>
</div>


<script>
    var h = "Basic Calculator"; //title
    var num1 = 12; //assigned value
    document.getElementById('head1').innerHTML = h;
</script>

</body>
</html>
